<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>决斗幸存者 · 玩家数据查看</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23c9a06a'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%231a1206' font-family='serif'%3E遊%3C/text%3E%3C/svg%3E" />
<style>
:root{--void:#08060f;--panel:#120d1e;--gold:#c9a34e;--gold-l:#f3e0a8;--gold-d:#7a5f22;
  --ink:#f2ecff;--ink-dim:#a89fc0;--red:#e0384a;
  --font-ui:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#1a1030,var(--void) 70%);color:var(--ink);
  font-family:var(--font-ui);display:flex;align-items:flex-start;justify-content:center;padding:6vh 18px}
.wrap{width:min(1080px,100%)}
.kicker{font-size:10px;letter-spacing:.42em;color:var(--gold);opacity:.8;text-align:center}
h1{font-size:24px;font-weight:400;letter-spacing:.3em;text-align:center;margin:10px 0 4px;
  background:linear-gradient(180deg,#fff,#c9a34e);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;font-size:12px;color:var(--ink-dim);letter-spacing:.1em;margin-bottom:24px}
.card{background:linear-gradient(168deg,#1c122e,#0a0614 75%);border:1px solid var(--gold-d);border-radius:6px;
  padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.6);margin-bottom:18px}
.hidden{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.top .who{font-size:15px;letter-spacing:.08em}
.top .who b{color:var(--gold-l);font-size:18px}
.btn{font-family:var(--font-ui);font-size:13px;letter-spacing:.12em;padding:9px 20px;border-radius:3px;cursor:pointer;
  border:1px solid var(--gold-d);color:var(--gold-l);background:linear-gradient(180deg,rgba(60,40,100,.55),rgba(20,12,36,.85));transition:.2s;text-decoration:none}
.btn:hover{border-color:var(--gold)}
h2.sec{font-size:12px;font-weight:400;letter-spacing:.3em;color:var(--gold);border-bottom:1px solid rgba(201,163,78,.25);
  padding-bottom:8px;margin-bottom:14px}
.kv{display:flex;flex-wrap:wrap;gap:12px 26px;font-size:13px}
.kv div{display:flex;gap:8px;align-items:baseline}
.kv span{color:var(--ink-dim);font-size:11px;letter-spacing:.14em}
.kv b{color:var(--gold-l);font-weight:600}
.tag{font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid rgba(201,163,78,.4);color:var(--gold-l)}
.tag.admin{border-color:rgba(224,56,74,.55);color:#ffb3b3}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid rgba(201,163,78,.3);background:rgba(201,163,78,.06)}
.chip.dim{opacity:.4}
/* 卡牌网格 */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;max-height:420px;overflow-y:auto;padding-right:4px}
.citem{text-align:center}
.citem img{width:100%;aspect-ratio:59/86;object-fit:cover;border-radius:5px;border:1px solid rgba(201,163,78,.35);display:block;background:#0a0614}
.citem .cph{width:100%;aspect-ratio:59/86;border-radius:5px;border:1px dashed rgba(201,163,78,.45);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;
  background:linear-gradient(160deg,#1b1230,#0b0716);color:#c9a34e;font-size:11px;line-height:1.3;box-sizing:border-box}
.citem .cn{font-size:10px;color:var(--ink);margin-top:5px;line-height:1.35;height:27px;overflow:hidden;word-break:break-all}
.citem .cq{font-size:10px;color:var(--gold)}
.empty{text-align:center;color:var(--ink-dim);padding:26px 0;letter-spacing:.2em;font-size:12px}
.line{min-height:18px;font-size:13px;letter-spacing:.06em;text-align:center}
.line.bad{color:#ff8a8a}
.denied{text-align:center;padding:40px 0;display:flex;flex-direction:column;gap:16px;align-items:center}
.loading{text-align:center;color:var(--ink-dim);letter-spacing:.24em;font-size:13px;padding:60px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">DUEL SURVIVOR · ADMIN VIEW</div>
  <h1>玩 家 数 据 查 看</h1>
  <div class="sub">只读详情页 · 管理员后台分页 · 决斗幸存者</div>

  <div class="card" id="denied-card">
    <div class="denied">
      <div style="font-size:14px;letter-spacing:.2em;color:var(--ink-dim)">需要管理员登录后访问</div>
      <a class="btn" href="admin.html">前往管理员后台 →</a>
    </div>
  </div>

  <div id="content" class="hidden">
    <div class="card">
      <div class="top">
        <div class="who">决斗者：<b id="v-name">—</b> <span id="v-role" class="tag">玩家</span></div>
        <div style="display:flex;gap:10px">
          <button class="btn" id="btn-reload">刷新</button>
          <a class="btn" href="admin.html">← 返回后台</a>
        </div>
      </div>
      <h2 class="sec">基 本 信 息</h2>
      <div class="kv" id="v-basic"></div>
    </div>

    <div class="card">
      <h2 class="sec">决 斗 进 度</h2>
      <div class="kv" id="v-progress"></div>
    </div>

    <div class="card">
      <h2 class="sec">解 锁 与 成 就</h2>
      <div class="kv" id="v-unlock"></div>
      <div class="chips" id="v-ach" style="margin-top:14px"></div>
    </div>

    <div class="card">
      <h2 class="sec">卡 牌 收 集（<span id="v-cnt">0</span> 种）</h2>
      <div class="cgrid" id="v-cards"></div>
      <div class="empty hidden" id="v-cards-empty">该玩家尚未收集卡牌</div>
    </div>
  </div>

  <div class="line" id="v-line"></div>
  <div class="loading hidden" id="v-loading">加 载 中 …</div>
</div>

<script>
window.DS_PUBLIC_CONFIG = {
  endpoint: "https://duel-survivor.app.workbuddy.host",
  oauthRelayBaseUrl: "https://www.workbuddy.cn/v2/as/genie-baas/oauth",
  publishableKey: "wbpk_sxEJaFtLNsUkXDTqQEj7X4_VTZCjWgwLQuG2hJH3wATLps0KH2K5viY"
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const KEY = 'ds_admin_session_v1';
  const LEVEL_NAMES = { temple: '王家神殿', kingdom: '决斗者王国', city: '战斗都市' };
  const CHAR_NAMES = { yugi: '武藤游戏', joey: '城之内克也', kaiba: '海马濑人' };
  const ACH_NAMES = {
    first_win: '初胜', kill100: '百人斩', kill500: '五百人斩', win_joey: '击败城之内',
    win_kaiba: '击败海马', win_god: '战胜三幻神', exodia: '封印解除', pack10: '开包新手'
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmtTime = t => t ? new Date(t).toLocaleString('zh-CN', { hour12: false }) : '—';
  const safeParse = s => { try { return typeof s === 'string' ? JSON.parse(s) : (s || {}); } catch (e) { return {}; } };
  let names = {};   // 卡 id → 中文名
  const LOCAL_IMGS = new Set();   // v0.4.2d：本地实装卡图 id（避免大量 404）

  /* 本地有图走本地，没有就回落官方 CDN —— 与游戏内 __cardImg 判定一致 */
  function imgSrc(id) {
    return LOCAL_IMGS.has(+id)
      ? 'data/cardimg/' + id + '.jpg'
      : 'https://images.ygoprodeck.com/images/cards/' + id + '.jpg';
  }
  /* 兜底链：本地 404 → CDN → 占位块（绝不出现裂图图标） */
  window.__cimgErr = function (el) {
    const id = el.dataset.id;
    if (!el.dataset.fb) {
      el.dataset.fb = '1';
      el.src = 'https://images.ygoprodeck.com/images/cards/' + id + '.jpg';
      return;
    }
    const ph = document.createElement('div');
    ph.className = 'cph';
    ph.textContent = (el.alt || ('卡 #' + id)).slice(0, 6);
    if (el.parentNode) { el.parentNode.insertBefore(ph, el); el.remove(); }
  };

  function kv(label, val) { return '<div><span>' + label + '</span><b>' + val + '</b></div>'; }

  async function loadNames() {
    try {
      const r = await fetch('data/cn_names.json');
      names = await r.json();
    } catch (e) { names = {}; }
    try {
      const r2 = await fetch('data/cardimg/index.json');
      const arr = await r2.json();
      (arr || []).forEach(x => LOCAL_IMGS.add(+x));
    } catch (e) { /* 没索引就当全都没有，走 CDN */ }
  }

  async function loadUser() {
    const name = new URLSearchParams(location.search).get('name');
    if (!name) { $('v-line').textContent = 'URL 缺少 ?name= 参数'; $('v-line').className = 'line bad'; return; }
    $('v-loading').classList.remove('hidden');
    try {
      let cloud = WorkBuddyCloud.createWorkBuddyCloud({
        endpoint: window.DS_PUBLIC_CONFIG.endpoint,
        oauthRelayBaseUrl: window.DS_PUBLIC_CONFIG.oauthRelayBaseUrl,
        publishableKey: window.DS_PUBLIC_CONFIG.publishableKey
      });
      const { data: rows, error } = await cloud.database.from('ds_users')
        .select('*').eq('name', name).maybeSingle();
      if (error) throw error;
      $('v-loading').classList.add('hidden');
      if (!rows) { $('v-line').textContent = '账号不存在：' + name; $('v-line').className = 'line bad'; return; }
      render(rows);
    } catch (e) {
      $('v-loading').classList.add('hidden');
      $('v-line').textContent = '加载失败：' + e.message;
      $('v-line').className = 'line bad';
    }
  }

  function render(r) {
    const d = safeParse(r.data);
    $('denied-card').classList.add('hidden');
    $('content').classList.remove('hidden');
    $('v-line').textContent = '';
    $('v-name').textContent = r.name;
    $('v-role').textContent = r.is_admin ? '管理员' : '玩家';
    $('v-role').className = 'tag' + (r.is_admin ? ' admin' : '');
    /* 基本信息 */
    $('v-basic').innerHTML =
      kv('账号 ID', r.id) +
      kv('持有日元', '¥ ' + (d.yen != null ? (+d.yen).toLocaleString() : '—')) +
      kv('注册时间', fmtTime(r.created_at)) +
      kv('最近登录', fmtTime(r.last_login));
    /* 进度 */
    const lvls = Array.isArray(d.levels) ? d.levels.map(l => LEVEL_NAMES[l] || l) : [];
    $('v-progress').innerHTML =
      kv('游戏局数', d.games || 0) +
      kv('总击败', d.totalKills || 0) +
      kv('开包次数', d.packsOpened || 0) +
      kv('解锁关卡', lvls.length ? lvls.join(' · ') : '—') +
      kv('最近决斗者', CHAR_NAMES[d.lastChar] || d.lastChar || '—');
    /* 解锁与成就 */
    const unl = d.unlocked || {};
    $('v-unlock').innerHTML = Object.keys(CHAR_NAMES).map(w =>
      '<div><span>' + CHAR_NAMES[w] + '</span><b>' + (unl[w] ? '已解锁' : '未解锁') + '</b></div>').join('');
    const ach = d.ach || {};
    const achKeys = Object.keys(ach).filter(k => ach[k]);
    $('v-ach').innerHTML = achKeys.length
      ? achKeys.map(k => '<span class="chip">' + esc(ACH_NAMES[k] || k) + '</span>').join('')
      : '<span class="chip dim">暂无成就</span>';
    /* 卡牌收集 */
    const owned = d.owned || {};
    const ids = Object.keys(owned).sort((a, b) => (+owned[b]) - (+owned[a]));
    $('v-cnt').textContent = ids.length;
    $('v-cards-empty').classList.toggle('hidden', ids.length > 0);
    $('v-cards').innerHTML = ids.map(id =>
      '<div class="citem">' +
      '<img loading="lazy" data-id="' + id + '" src="' + imgSrc(id) + '" alt="' + esc(names[id] || ('卡 #' + id)) + '" onerror="window.__cimgErr(this)">' +
      '<div class="cn">' + esc(names[id] || ('卡 #' + id)) + '</div>' +
      '<div class="cq">×' + (+owned[id] || 1) + '</div></div>').join('');
  }

  /* ---------- 启动：仅管理员会话可见 ---------- */
  if (!sessionStorage.getItem(KEY)) {
    /* 未登录：停留提示页 */
  } else {
    $('denied-card').classList.add('hidden');
    $('v-loading').classList.remove('hidden');
    Promise.resolve(loadNames()).then(loadUser);
    $('btn-reload').addEventListener('click', () => { $('v-loading').classList.remove('hidden'); loadUser(); });
  }
})();
</script>
</body>
</html>
